spring:
  application:
    name: sip-backend
  profiles:
    default: local
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      # Keep startup lazy and existing datasource configuration tests connection-free.
      hibernate.boot.allow_jdbc_metadata_access: false
      hibernate.jdbc.time_zone: UTC
logging:
  level:
    # Constraint exceptions and JDBC bind diagnostics may contain account data.
    org.hibernate.orm.jdbc.error: "OFF"
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
    org.hibernate.orm.jdbc.bind: "OFF"
    org.hibernate.orm.jdbc.extract: "OFF"
    org.hibernate.SQL: "OFF"
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:${SERVER_PORT:8080}}
